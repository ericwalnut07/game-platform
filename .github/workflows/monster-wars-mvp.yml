name: Monster Wars MVP
on:
  pull_request:
    paths:
      - "apps/monster-wars/**"
      - "src/games/monster-wars/**"
      - "tests/monster-wars/**"
      - "tests/unit/monster-wars*.test.ts"
      - ".github/workflows/monster-wars-mvp.yml"
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit --strict --noUncheckedIndexedAccess --exactOptionalPropertyTypes --skipLibCheck --target ES2022 --module ESNext --moduleResolution Bundler --types vite/client apps/monster-wars/main.ts src/games/monster-wars/*.ts
      - name: Game unit tests
        run: npx vitest run tests/unit/monster-wars*.test.ts
      - name: Build offline file
        run: npx vite build --config apps/monster-wars/vite.config.mts
      - name: Build official internal HTML
        run: npx vite build --config apps/monster-wars/vite.config.mts --mode official
      - run: npx playwright install --with-deps chromium
      - name: Offline Chromium desktop and touch test
        run: node tests/monster-wars/offline.mjs
      - name: Official edition storage and offline regression
        run: node tests/monster-wars/official-offline.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: monster-wars-offline-${{ github.sha }}
          path: dist/monster-wars-offline/index.html
