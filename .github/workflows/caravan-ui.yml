name: Caravan verification

on:
  pull_request:
    paths:
      - 'src/client/games/ooishi-caravan/**'
      - 'src/client/games/shared/**'
      - 'src/games/ooishi-caravan/**'
      - 'src/client/solo/registry.ts'
      - 'tests/unit/ooishi-caravan/**'
      - 'tests/e2e/ooishi-caravan*.spec.ts'
      - 'src/client/pages/CreateRoomPage.tsx'
      - 'src/client/pages/RoomLobbyPage.tsx'
      - 'src/server/durable-objects/RoomObject.ts'
      - 'src/server/lib/playtest-log.ts'
      - 'src/server/lib/catalog.ts'
      - 'src/games/registry.ts'
      - 'src/shared/version.ts'
      - 'package*.json'
      - 'tests/e2e/fixtures/caravan-screen.tsx'
      - 'tests/e2e/helpers/stacked-stones.ts'
      - 'tests/e2e/solo-navigation.spec.ts'
      - '.github/workflows/caravan-ui.yml'

concurrency:
  group: caravan-ui-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  caravan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/unit/ooishi-caravan tests/unit/game-registry.test.ts tests/unit/room-socket.test.ts
      - run: npm run test:migrations
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/ooishi-caravan.spec.ts tests/e2e/ooishi-caravan-online.spec.ts tests/e2e/solo-navigation.spec.ts
      - name: Save Caravan UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: caravan-ui-${{ github.sha }}
          path: test-results/
          include-hidden-files: true
          retention-days: 7
