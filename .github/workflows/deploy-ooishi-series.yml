name: Deploy Ooishi series
run-name: Deploy Ooishi series to production
on:
  workflow_dispatch:
    inputs:
      game_scope:
        description: Explicit release scope
        required: true
        type: choice
        options: [ooishi-series]
      commit_sha:
        description: Exact verified current main commit (40 characters)
        required: true
        type: string
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '/deploy'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate explicit scope and pinned main
        id: request
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SCOPE: ${{ inputs.game_scope }}
          RELEASE_SHA: ${{ inputs.commit_sha }}
          RELEASE_BODY: ${{ github.event.comment.body }}
          RELEASE_AUTHOR: ${{ github.event.comment.user.login }}
          RELEASE_OWNER: ${{ github.repository_owner }}
          RELEASE_IS_PR: ${{ github.event.issue.pull_request && 'true' || 'false' }}
        run: node scripts/ooishi-release.mjs select
      - name: Require current main and a merged PR for comment requests
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
          REQUEST_PR: ${{ github.event.issue.number }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$REQUEST_PR" --jq '{merged, base: .base.ref, sha: .merge_commit_sha}' > "$RUNNER_TEMP/release-pr.json"
            node --input-type=module -e 'import fs from "node:fs"; const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/release-pr.json")); if(!p.merged || p.base!=="main" || p.sha!==process.env.EXPECTED_SHA) throw Error("Request must refer to the merged current-main PR");'
          fi
      - run: npm ci
      - name: Check applied production migrations without changing D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          set -o pipefail
          npx wrangler d1 execute game-platform-db --remote --command 'SELECT name FROM d1_migrations ORDER BY name' --json | tee "$RUNNER_TEMP/ooishi-d1.json"
          node scripts/ooishi-release.mjs migrations "$RUNNER_TEMP/ooishi-d1.json"
      - run: node --test tests/release/ooishi-release.test.mjs
      - run: npm run preflight
      - run: npm run typecheck
      - run: npx vitest run tests/unit/ooishi-line tests/unit/ooishi-caravan tests/unit/ooishi-territory-2 tests/unit/shared-random.test.ts tests/unit/game-registry.test.ts tests/unit/room-socket.test.ts
      - run: node scripts/run-line-npc.cjs --games=6
      - run: npm run test:migrations
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- tests/e2e/ooishi-line.spec.ts tests/e2e/ooishi-line-online.spec.ts tests/e2e/ooishi-caravan.spec.ts tests/e2e/ooishi-caravan-online.spec.ts tests/e2e/ooishi-territory-2.spec.ts tests/e2e/territory2-solo-modes.spec.ts tests/e2e/solo-navigation.spec.ts
      - name: Recheck main immediately before deploy
        env:
          EXPECTED_SHA: ${{ steps.request.outputs.commit }}
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - name: Deploy verified Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Save scoped release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ooishi-release-${{ github.run_id }}
          path: test-results/
          include-hidden-files: true
          retention-days: 7
