name: Diagnose production D1 (read only)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: [.github/workflows/d1-readonly-check.yml]
permissions:
  contents: read
jobs:
  check-d1:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Check credential presence without displaying values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::CLOUDFLARE_API_TOKEN is missing"; exit 1; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"; exit 1; fi
          echo "Both Cloudflare credentials are present; values are not displayed."
      - name: Read and compare applied D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute game-platform-db --remote --command 'SELECT name FROM d1_migrations ORDER BY name' --json | tee "$RUNNER_TEMP/d1-readonly.json"
          node scripts/ooishi-release.mjs migrations "$RUNNER_TEMP/d1-readonly.json"
          echo "D1 read-only comparison passed. No migration or Worker deployment was executed." >> "$GITHUB_STEP_SUMMARY"
