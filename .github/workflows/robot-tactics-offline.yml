name: Robot tactics offline verification

on:
  pull_request:
    paths:
      - 'apps/robot-tactics/**'
      - 'src/games/robot-tactics/**'
      - 'src/client/games/robot-tactics/**'
      - 'docs/design/robot-tactics/**'
      - 'tests/unit/robot-*.test.ts'
      - 'tests/fixtures/robot-addon-constraints-*.json'
      - 'tests/robot-tactics/**'
      - '.github/workflows/robot-tactics-offline.yml'

concurrency:
  group: robot-offline-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  robot-offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Check the offline app and game types
        run: >-
          npx tsc --noEmit --strict --noUnusedLocals --noUnusedParameters
          --noUncheckedIndexedAccess --exactOptionalPropertyTypes --target ES2022
          --module ESNext --moduleResolution Bundler --resolveJsonModule --skipLibCheck
          src/games/robot-tactics/*.ts src/client/games/robot-tactics/*.ts
          apps/robot-tactics/*.ts apps/robot-tactics/*.mts tests/unit/robot-*.test.ts
          tests/robot-tactics/offline*.ts tests/robot-tactics/offline*.mts
          tests/robot-tactics/offline-fixture/*.ts
          tests/robot-tactics/battle*.ts tests/robot-tactics/battle*.mts
          tests/robot-tactics/battle-fixture/*.ts
          tests/robot-tactics/formal*.ts tests/robot-tactics/formal*.mts
          tests/robot-tactics/vfx*.ts
          tests/robot-tactics/early*.ts tests/robot-tactics/hazard*.ts tests/robot-tactics/m02*.ts tests/robot-tactics/approved*.ts tests/robot-tactics/addon*.ts tests/robot-tactics/fuse*.ts tests/robot-tactics/remaining*.ts
          tests/robot-tactics/core*.ts
          tests/robot-tactics/weapon*.ts tests/robot-tactics/weapon*.mts
          tests/robot-tactics/weapon-fixture/*.ts
          tests/robot-tactics/art*.ts tests/robot-tactics/art*.mts
          tests/robot-tactics/art-fixture/*.ts
      - run: npx vitest run tests/unit/robot-*.test.ts --maxWorkers=2
      - run: npx vite build --config apps/robot-tactics/vite.config.mts
      - name: Package independent offline playtest HTML
        uses: actions/upload-artifact@v7
        with:
          name: robot-tactics-playtest-html
          path: dist/robot-tactics-offline/index.html
          if-no-files-found: error
          retention-days: 14
      - run: npx vite build --config tests/robot-tactics/offline.vite.config.mts
      - run: npx vite build --config tests/robot-tactics/battle.vite.config.mts
      - run: npx vite build --config tests/robot-tactics/weapon.vite.config.mts
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/robot-tactics/offline.playwright.config.ts --workers=2
      - run: npx playwright test --config tests/robot-tactics/battle.playwright.config.ts --workers=2
      - run: npx playwright test --config tests/robot-tactics/weapon.playwright.config.ts --workers=2
      - name: Bundle the Node-side formal test controller
        run: npx vite build --config tests/robot-tactics/formal.harness.vite.config.mts
      - name: Verify difficulty-specific subobjective completion marks (PC/mobile)
        run: npx playwright test --config tests/robot-tactics/subobjective-completion.playwright.config.ts --workers=2
      - name: Verify approved facility images and objective taps in real offline missions (PC/mobile)
        run: npx playwright test --config tests/robot-tactics/facility.playwright.config.ts --workers=2
      - name: Verify production M01 on landscape PC and landscape mobile (not a fixture)
        run: npx playwright test --config tests/robot-tactics/formal.playwright.config.ts --workers=2
      - name: Verify VFX frames, timing, layering and cancellation on landscape PC and mobile
        run: npx playwright test --config tests/robot-tactics/vfx.playwright.config.ts --workers=2
      - name: Verify final addon costs and manual blast locations on landscape PC and mobile
        run: npx playwright test --config tests/robot-tactics/addon.playwright.config.ts --workers=2
      - name: Verify delayed fuse attachment, NPC timer, saves and VFX in real M01 on landscape PC/mobile
        run: npx playwright test --config tests/robot-tactics/fuse.playwright.config.ts --workers=2
      - name: Verify remaining addon actions, atomic saves and real M01 on landscape PC/mobile
        run: npx playwright test --config tests/robot-tactics/remaining.playwright.config.ts --workers=2
      - name: Verify adopted addon choices, continuations, saves and VFX in M01 on landscape PC/mobile
        run: npx playwright test --config tests/robot-tactics/approved.playwright.config.ts --workers=2
      - name: Verify formal M02 boss, progression, saves and landscape controls
        run: npx playwright test --config tests/robot-tactics/m02.playwright.config.ts --workers=2
      - name: Verify final environmental addons in real M01 on landscape PC/mobile
        run: npx playwright test --config tests/robot-tactics/hazard.playwright.config.ts --workers=2
      - name: Verify M03-M07 objectives, progression, saves and landscape controls
        run: npx playwright test --config tests/robot-tactics/early.playwright.config.ts --workers=2
      - name: Upload VFX visual review images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-vfx-review
          path: test-results/robot-vfx-review
          if-no-files-found: ignore

  approved-art:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx vite build --config apps/robot-tactics/vite.config.mts
      - run: npx vite build --config tests/robot-tactics/art.vite.config.mts
      - run: npx playwright install --with-deps chromium
      - name: Verify the ten PNGs, real customization/M01, slot selection and fallbacks offline
        run: npx playwright test --config tests/robot-tactics/art.playwright.config.ts --workers=2
      - name: Build the optional customization master profile
        env:
          VITE_ROBOT_ART_PORTRAITS: 'true'
        run: npx vite build --config apps/robot-tactics/vite.config.mts --outDir ../../test-results/robot-portrait-app
      - name: Verify 1024px customization and 256px battle art offline
        run: npx playwright test --config tests/robot-tactics/art-portrait.playwright.config.ts --workers=2
      - name: Upload approved art visual review images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: robot-approved-art-review
          path: test-results/robot-vfx-review
          if-no-files-found: ignore
